# Regresi guard untuk FORK diluviumm/superpowers (bukan workflow upstream —
# obra/superpowers tidak punya CI; workflow ini khusus fork kita).
# Menjaga: (1) fix .muse-plugin tetap terpasang, (2) frontmatter skill valid,
# (3) suite integrasi Hermes hijau.
name: regresi-fork

# Batalkan run lama yang masih mengantri saat ada push baru (ref sama) —
# hemat runner & hasil selalu mencerminkan commit terbaru.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fork-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Fork guard (larangan .muse-plugin/plugin.json + manifest + frontmatter)
        run: python3 scripts/fork-guard.py

  hermes-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Suite integrasi Hermes (bootstrap + plugin registration)
        run: python -m pytest tests/hermes/ -q

  # Suite harness-agnostic yang lolos uji lokal fork (27 Sep 2026): shell-lint,
  # diagnosing (46/46), hooks, systematic-debugging. Ditiadakan: writing-skills
  # (butuh graphviz), version-bump (butuh yq), explicit-skill-requests (butuh API model),
  # suite harness spesifik (claude-code/codex/devin/kimi/opencode/pi/antigravity).
  bash-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: shell-lint (semua .sh termasuk start-server.sh yang di-patch)
        run: bash tests/shell-lint/test-lint-shell.sh
      - name: diagnosing-superpowers (struktur skill)
        run: bash tests/diagnosing-superpowers/test-skill-structure.sh
      - name: hooks (session-start)
        run: bash tests/hooks/test-session-start.sh
      - name: systematic-debugging (find-polluter)
        run: bash tests/systematic-debugging/test-find-polluter.sh
      # Suite tool-tambahan: yq & graphviz (1 Okt 2026) — yq di-pin + checksum,
      # graphviz dari repo Ubuntu runner (sudo aman di CI).
      - name: Install yq (pin + verifikasi checksum)
        run: |
          curl -fsSL -o /tmp/yq https://github.com/mikefarah/yq/releases/download/v4.54.1/yq_linux_amd64
          echo "8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f  /tmp/yq" | sha256sum -c -
          sudo install -m755 /tmp/yq /usr/local/bin/yq
      - name: version-bump suite
        run: bash tests/version-bump/test-bump-version.sh
      - name: Install graphviz (render suite)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz
      - name: writing-skills suite (render-graphs)
        run: bash tests/writing-skills/test-render-graphs.sh

  # branding.test.js:
  #   - PASS utk SUPERPOWERS_DISABLE_TELEMETRY=true (keputusan fork kita).
  #   - Test "by default" kini STRIP var opt-out telemetry dari env ambien
  #     (fix 1 Okt 2026) → deterministik di CI dan lokal, berapa pun env shell.
  node-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Install test deps (ws)
        run: npm install --prefix tests/brainstorm-server --no-audit --no-fund
      - name: brainstorm-server suite (branding + lifecycle + start/stop server)
        run: cd tests/brainstorm-server && npm test

  # Suite harness lintas-agen yang lolos uji lokal fork (1 Okt 2026) —
  # ringan, tanpa dependensi eksternal di luar tool bawaan runner.
  # Perluas daftar ini hanya bila suite lolos lokal DAN di CI.
  harness-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # >= 23.6: native TypeScript type-stripping, dipakai test pi yang
          # memuat .pi/extensions/superpowers.ts langsung (Node 20 -> gagal).
          node-version: "24"
      - name: opencode (bootstrap-caching + plugin-loading)
        run: |
          bash tests/opencode/test-bootstrap-caching.sh
          bash tests/opencode/test-plugin-loading.sh
      - name: kimi + devin + antigravity manifests
        run: |
          bash tests/kimi/test-plugin-manifest.sh
          bash tests/devin/test-devin-plugin.sh
          bash tests/antigravity/test-antigravity-tools.sh
      - name: codex (marketplace + package-archive + plugin-sync)
        run: |
          bash tests/codex/test-marketplace-manifest.sh
          bash tests/codex/test-package-codex-plugin.sh
          bash tests/codex-plugin-sync/test-sync-to-codex-plugin.sh
      - name: pi extension
        run: node tests/pi/test-pi-extension.mjs
