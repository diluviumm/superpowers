# Regresi guard untuk FORK diluviumm/superpowers (bukan workflow upstream —
# obra/superpowers tidak punya CI; workflow ini khusus fork kita).
# Menjaga: (1) fix .muse-plugin tetap terpasang, (2) frontmatter skill valid,
# (3) suite integrasi Hermes hijau.
name: regresi-fork

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fork-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fork guard (larangan .muse-plugin/plugin.json + manifest + frontmatter)
        run: python3 scripts/fork-guard.py

  hermes-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Suite integrasi Hermes (bootstrap + plugin registration)
        run: python -m pytest tests/hermes/ -q
